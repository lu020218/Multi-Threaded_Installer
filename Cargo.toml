[workspace]
resolver = "2"
members = [
    "installer_shared",
    "installer_core",
    "packager_cli",
    "installer_cli",
    "installer_gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Installer Team"]
license = "MIT"
repository = "https://github.com/example/rust-installer"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rmp-serde = "1.3"

# Compression
zstd = "0.13"
lzma-rs = "0.3"

# Parallelism
rayon = "1.10"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }

# Testing
proptest = "1.5"

# CLI
clap = { version = "4.5", features = ["derive"] }

# File system utilities
walkdir = "2.5"
tempfile = "3.10"
fs2 = "0.4"

# Checksums
crc32fast = "1.4"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
base64 = "0.22"
ed25519-dalek = "2.1"

# Archive
tar = "0.4"
flate2 = "1.0"

# Platform-specific (Windows)
winreg = "0.52"
mslnk = "0.1"
is_elevated = "0.1"
sysinfo = "0.31"

# Tauri
tauri = { version = "2.0", features = [] }
tauri-build = { version = "2.0", features = [] }

# Async runtime (for Tauri)
tokio = { version = "1.37", features = ["full"] }

# Internal crates
installer_shared = { path = "installer_shared" }
installer_core = { path = "installer_core" }
