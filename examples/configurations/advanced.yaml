schemaVersion: 3

app:
  id: my_desktop_app_advanced
  name: MyDesktopApp Advanced
  version: 2.0.0
  publisher: MyCompany
  website: https://example.com
  icon: app.ico
  versionInfo:
    productName: MyDesktopApp Advanced
    fileDescription: MyDesktopApp Advanced Installer
    fileVersion: 2.0.0.0
    productVersion: 2.0.0.0
    companyName: MyCompany

package:
  compression:
    algorithm: zstd
    level: 10

installer:
  requireAdmin: true
  defaultDir: "%ProgramFiles%\\MyDesktopAppAdvanced"
  directoryName: MyDesktopAppAdvanced
  minWindows: "10.0.19041"
  largeFileThresholdBytes: 4194304
  mutex: "Global\\my_desktop_app_advanced_Install"
  killBeforeInstall:
    - MyDesktopApp.exe
    - MyDesktopAppHelper.exe
  defaults:
    autoStartup: false
    desktopShortcut: true
  installState:
    registries:
      - id: main
        path: "HKCU\\Software\\my_desktop_app_advanced"
        values:
          installDir:
            key: InstallDir
            value: "%InstallDir%"
            type: expand
          installState:
            key: InstallState
            value: "%InstallState%"
            type: string
          version:
            key: Version
            value: "%Version%"
            type: string
          channel:
            key: Channel
            value: stable
            type: string
    files:
      - id: localUser
        path: "%LocalAppData%\\MyDesktopAppAdvanced\\install-state.json"
        format: json
        values:
          installDir:
            name: installDir
            value: "%InstallDir%"
          installedBy:
            name: installedBy
            value: "%UserName%"
    detect:
      primary:
        registry: main
        value: installDir
      legacy:
        - id: legacy_v2
          path: "HKCU\\Software\\MyCompany\\MyDesktopApp"
          installDirValue: Path
        - id: legacy_v1
          path: "HKLM\\Software\\MyDesktopAppLegacy"
          installDirValue: InstallDir
  systemUninstallEntry:
    scope: both
    displayName: MyDesktopApp Advanced
    publisher: MyCompany
  cleanup:
    systemUninstallEntry:
      legacyEntries:
        - displayName: MyDesktopAppLegacy
          scope: both
  ui:
    defaultLanguage: zh_CN
    desktopShortcutName:
      default: MyDesktopApp Advanced
      zh_CN: 我的高级应用
  payload:
    - id: app
      source: app
      target: "%InstallDir%"
      required: true
    - id: resources
      source: resources
      target: "%InstallDir%\\resources"
      required: true
    - id: plugins
      source: plugins
      target: "%InstallDir%\\plugins"
      required: false
  components:
    - id: core
      name: Core Application
      required: true
      defaultSelected: true
      payload:
        - app
        - resources
    - id: optional_plugins
      name: Optional Plugins
      required: false
      defaultSelected: true
      dependsOn:
        - core
      payload:
        - plugins
  registry:
    write:
      - path: "HKCU\\Software\\my_desktop_app_advanced"
        values:
          InstallLocation:
            value: "%InstallDir%"
            type: expand
          LaunchCommand:
            value: "\"%InstallDir%\\MyDesktopApp.exe\""
            type: expand

uninstaller:
  requireAdmin: true
  killBeforeUninstall:
    - MyDesktopApp.exe
    - MyDesktopAppHelper.exe
  cleanup:
    installedFiles: manifest
    missingManifestFallback: safeDirectoryFallback
    installState: markUninstalled
    autoStartup: auto
    desktopShortcut: auto
    systemUninstallEntry:
      scope: both
      displayName: MyDesktopApp Advanced
      legacyEntries:
        - displayName: MyDesktopAppLegacy
          scope: both
    legacy:
      desktopShortcutNames:
        - MyDesktopApp Legacy
      startupNames:
        - MyDesktopAppLegacy
    registry:
      deleteKeys:
        - "HKCU\\Software\\MyDesktopAppLegacy"
      deleteValues:
        - path: "HKCU\\Software\\my_desktop_app_advanced"
          key: TemporaryValue
    paths:
      - path: "%LocalAppData%\\MyDesktopAppAdvanced\\Cache"
        recursive: true
        onlyIfEmpty: false
  ui:
    defaultLanguage: zh_CN
    title: 卸载 MyDesktopApp Advanced
    confirmMessage: 是否卸载 MyDesktopApp Advanced？
