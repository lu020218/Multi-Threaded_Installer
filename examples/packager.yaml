schemaVersion: 3

app:
  id: my_desktop_app
  name: MyDesktopApp
  version: 1.2.3
  publisher: MyCompany
  website: https://example.com
  icon: app.ico
  versionInfo:
    productName: MyDesktopApp
    fileDescription: MyDesktopApp Installer
    fileVersion: 1.2.3.4
    productVersion: 1.2.3.4
    companyName: MyCompany

package:
  compression:
    algorithm: xz
    level: 9

installer:
  requireAdmin: true
  defaultDir: "%ProgramFiles%\\MyDesktopApp"
  directoryName: MyDesktopApp
  minWindows: "10.0.19041"
  largeFileThresholdBytes: 4194304
  mutex: "Global\\my_desktop_app_Install"
  killBeforeInstall:
    - MyDesktopApp.exe
  defaults:
    autoStartup: true
    desktopShortcut: true
  installState:
    registries:
      - id: main
        path: "HKCU\\Software\\my_desktop_app"
        values:
          installDir:
            key: InstallDir
            value: "%InstallDir%"
            type: expand
          installState:
            key: InstallState
            value: "%InstallState%"
            type: string
          version:
            key: Version
            value: "%Version%"
            type: string
    files:
      - id: main
        path: "%ProgramData%\\my_desktop_app\\install-state.json"
        format: json
        values:
          installDir:
            name: installDir
            value: "%InstallDir%"
          installState:
            name: state
            value: "%InstallState%"
    detect:
      primary:
        registry: main
        value: installDir
      legacy:
        - id: legacy_v2
          path: "HKCU\\Software\\MyCompany\\MyDesktopApp"
          installDirValue: Path
  systemUninstallEntry:
    scope: machine
    displayName: MyDesktopApp
    publisher: MyCompany
  cleanup:
    systemUninstallEntry:
      legacyEntries:
        - displayName: MyDesktopAppLegacy
          scope: both
  ui:
    defaultLanguage: zh_CN
    desktopShortcutName:
      default: MyDesktopApp
      zh_CN: 我的应用
      en_US: MyDesktopApp
  payload:
    - id: app
      source: app
      target: "%InstallDir%"
      required: true
    - id: resources
      source: resources
      target: "%InstallDir%\\resources"
      required: true
  components:
    - id: core
      name: Core Application
      required: true
      defaultSelected: true
      payload:
        - app
        - resources
  registry:
    write:
      - path: "HKCU\\Software\\my_desktop_app"
        values:
          InstallLocation:
            value: "%InstallDir%"
            type: expand

uninstaller:
  requireAdmin: true
  killBeforeUninstall:
    - MyDesktopApp.exe
  cleanup:
    installedFiles: manifest
    missingManifestFallback: safeDirectoryFallback
    installState: delete
    autoStartup: auto
    desktopShortcut: auto
    systemUninstallEntry:
      scope: machine
      displayName: MyDesktopApp
      legacyEntries:
        - displayName: MyDesktopAppLegacy
          scope: both
    registry:
      deleteKeys:
        - "HKCU\\Software\\MyDesktopAppLegacy"
      deleteValues: []
    paths:
      - path: "%LocalAppData%\\MyDesktopApp\\Cache"
        recursive: true
        onlyIfEmpty: false
  ui:
    defaultLanguage: zh_CN
    title: 卸载 MyDesktopApp
    confirmMessage: 是否卸载 MyDesktopApp？
