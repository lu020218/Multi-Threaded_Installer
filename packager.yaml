# -----------------------------------------------------------------------------
# Multi-Threaded Installer 打包配置（值/逻辑归位后的精简 schema）
#
# 划分原则（详见 docs/USER_GUIDE.md）：
#   YAML  = 声明“本次构建是什么 + 怎么打包 + 跑哪两个 bat”，改它不需要重编引擎。
#   引擎  = 所有稳定机制（安装行为默认值、清理、注册表、系统卸载入口…）
#           + 跨版本兼容迁移（C++ 迁移表，跟版本走，改它要重编）。
#
# 旧版本兼容逻辑不在这里 —— 一律走引擎内的迁移函数（src/installer/migration）。
#
# 打包命令示例：
#   packager.exe --input <input_dir> --config <config_dir> --output <output.exe>
#   （--config 目录需含本文件、resources/ 资源目录，以及 hooks 引用的 bat）
# -----------------------------------------------------------------------------

# ── 本次构建的身份与取值 ──────────────────────────────────────────────
app:
  productName: SampleDesktopApp        # 用户可见产品名（数据目录/注册表键统一用它）
  publisher: SampleCompany             # 发布者；同时作为版本资源 CompanyName
  version: 1.0.0                       # 每次发版必改（可含 -beta 等预发布后缀）
  defaultDir: "%ProgramFiles%\\SampleDesktopApp"   # GUI 默认安装目录

  # icon：安装器 exe 图标，路径相对 --config 目录解析，写入 PE 资源。可选，留空则不改图标。
  # icon: app.ico

  # copyright：可选。缺省时引擎用 publisher + 构建年份生成；需要特定措辞时在此覆盖。
  # copyright: "Copyright (c) 2026 SampleCompany"

# ── 打包基础参数 ─────────────────────────────────────────────────────
package:
  # compression：algorithm = xz（LZMA2，压缩率高）| zstd（速度快）；level = 压缩级别。
  # blockSize（可选，单位 MiB，仅 xz 生效）：多线程把载荷切成独立块压缩，块越大压缩比越好、
  #   解压并行度越低。0/缺省 = 自动（按载荷大小取约 4 块、夹在 64–256MiB，兼顾压缩比与多线程
  #   解压，与安装器解码线程上限对齐）。想要更小体积调大（如 512，趋近单流、解压转串行）；
  #   想要更快解压调小（如 64）。
  compression: { algorithm: xz, level: 9 }   # 例：{ algorithm: xz, level: 9, blockSize: 256 }
  layout:
    - { source: app,     target: "%InstallDir%" }
    - { source: plugins, target: "%ProgramData%\\SampleDesktopApp\\plugins" }

  # layout（可选）：逐文件夹落点。source = --input 顶层子目录名；target = 安装目标，
  # 支持 %InstallDir% 与环境变量（%AppData% / %LocalAppData% / %ProgramData% 等）。
  # 未在此声明的子目录默认落到 %InstallDir%\<目录名>。
  # 注意：安装器以管理员权限运行，%AppData%/%LocalAppData% 展开的是被提权账户的目录，
  #       未必是当前登录用户；需"全机共享"用 %ProgramData% 更稳妥。
  # layout:
  #   - { source: app,     target: "%InstallDir%" }
  #   - { source: plugins, target: "%ProgramData%\\SampleDesktopApp\\plugins" }

# ── 安装前/后脚本（契约见 docs/USER_GUIDE.md §7 安装脚本契约）──
#
# 引擎写死的契约（不可在此覆盖）：
#   · 退出码 0 = 成功，非 0 / 超时 = 失败 → 走该脚本的 onFailure；
#   · 注入环境变量 INSTALL_DIR、VERSION；脚本继承安装器管理员权限（勿再 elevate）；
#   · 仅做本次构建特有、与版本演进无关的收尾动作；跨版本兼容走引擎迁移。
#
# preInstall / postInstall 均为「脚本列表」，按声明顺序依次执行，可配置多个；
# 脚本类型按扩展名识别，支持 .bat / .cmd / .ps1。不需要 hook 时整段删除即可。
hooks:
  preInstall:
    - path: scripts/pre_install.bat
      args: ""
      onFailure: abort                 # abort（中止并回滚） | continue（记日志继续）
      timeoutSec: 300
    - path: scripts/pre_install.ps1    # 同一钩子点可再挂 ps1/其他脚本，按顺序执行
      args: ""
      onFailure: continue
      timeoutSec: 120

  postInstall:
    - path: scripts/post_install.bat
      args: ""
      onFailure: continue
      timeoutSec: 600
