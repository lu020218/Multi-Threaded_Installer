[pytest]
# 安装器测试真实读写 HKLM/桌面/文件系统，需管理员且必须串行执行（单实例互斥）。
addopts = -v -ra -p no:randomly -p no:selenium -p no:variables
markers =
    packager: 打包器行为（校验拦截、分帧、图标）
    fresh: 全新安装
    upgrade: 升级安装（跳过/增量/门控）
    hooks: pre/post 钩子脚本
    components: 组件安装/卸载
    uninstall: 卸载与残留清扫
    locked: 锁定文件（pending-replace）
    language: 语言参数与注册表
    progress: 进度契约（中途事件/单调/脉冲）
    standard: 编码规范（禁用函数）
    gui: GUI 自动化（Tier A/B）
    real: 真实包全周期（需 MTI_REAL_INPUT，默认不跑）
    slow: 耗时用例
